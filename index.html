<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Jonathan's Sort of Refactored Don't Laugh Challenge</title>
    <script src="script.js" defer></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

      /* Reset and Box-Sizing */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Body Styling */
      body {
        background: linear-gradient(135deg, #4a90e2, #7d3cff);
        font-family: 'Roboto', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        margin: 0;
        padding: 20px;
        transition: background 0.5s ease; /* Smooth transition for dark mode */
      }

      /* Container Styling */
      .container {
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15), 0 6px 6px rgba(0, 0, 0, 0.1);
        padding: 50px 20px;
        text-align: center;
        max-width: 90%;
        width: 600px;
        transition: transform 0.3s ease-in-out; /* Smooth hover effect */
      }

      /* Subtle Floating Effect */
      .container:hover {
        transform: scale(1.02);
      }

      /* Title Styling */
      h3 {
        margin: 0;
        opacity: 0.7;
        letter-spacing: 1.5px;
      }

      /* Joke Text Styling */
      .joke {
        font-size: 28px;
        letter-spacing: 1px;
        line-height: 36px;
        margin: 40px auto;
        max-width: 500px;
      }

      /* Button Styling */
      .btn {
        background-color: #7d3cff;
        color: #fff;
        border: 0;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        padding: 12px 35px;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }

      .btn:hover {
        background-color: #5d2cd6;
      }

      .btn:active {
        transform: scale(0.96);
      }

      .btn:focus {
        outline: 0;
      }

      /* Dark Mode Toggle */
      .dark-mode {
        background: linear-gradient(135deg, #1a1a1a, #4a4a4a);
        color: white;
      }

      /* Dark Mode Container */
      .dark-mode .container {
        background-color: #333;
        color: #fff;
      }

      /* Dark Mode Button */
      #darkModeBtn {
        margin-top: 20px;
        padding: 10px 20px;
        border: none;
        background: #222;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
      }

      #darkModeBtn:hover {
        background: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>Jonathan's Sort of Refactored Don't Laugh Challenge</h3>
      <div id="joke" class="joke">Loading...</div>
      <button id="jokeBtn" class="btn">Get Another Joke</button>
    </div>

    <!-- Dark Mode Toggle -->
    <button id="darkModeBtn">Toggle Dark Mode</button>

    <script>
      // Selectors 
      const jokeEl = document.getElementById('joke');
      const jokeBtn = document.getElementById('jokeBtn');
      const darkModeBtn = document.getElementById('darkModeBtn');

      // Function to fetch joke from API
      async function generateJoke() {
        jokeEl.textContent = "Loading..."; // Show loading indicator
        const config = {
          headers: { Accept: 'application/json' },
        };

        try {
          const res = await fetch('https://icanhazdadjoke.com', config);
          const data = await res.json();
          jokeEl.textContent = data.joke; // Display joke
        } catch (error) {
          jokeEl.textContent = "Oops! Something went wrong. Try again.";
        }
      }
      generateJoke();

      // Event Listeners
      jokeBtn.addEventListener('click', generateJoke);

      // Pressing "Enter" generates a joke
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          generateJoke();
        }
      });

      // Toggle Dark Mode
      darkModeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
      });
    </script>
  </body>
</html>
